name: System Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x health_v2.sh

      - name: Run health check
        run: ./health_v2.sh

      - name: Show log output
        run: cat health.log
